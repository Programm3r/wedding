<!DOCTYPE html>
<!--
  Paints the aged-parchment envelope artwork used by the intro:
    images/envelope-front.webp  (the pocket: side flaps + bottom flap, V-shaped opening)
    images/envelope-flap.webp   (the closing flap)
  Open this page in a browser and right-click each canvas to save it, or see README.
  Everything is drawn from seeded noise, so the result is the same every time.
-->
<html>
<head>
<meta charset="UTF-8" />
<title>Envelope artwork generator</title>
<style>body { margin: 0; background: #1a2238; } canvas { display: block; margin: 20px; }</style>
</head>
<body>
<canvas id="front"></canvas>
<canvas id="flap"></canvas>
<pre id="out" hidden></pre>
<script>
(function () {
  "use strict";

  const W = 1280, H = 832;           // envelope, 16 : 10.4
  const FH = Math.round(H * 0.6);    // the flap covers the top 60%
  const V = 0.56;                    // depth of the pocket's V opening

  /* ---------- Seeded value noise ---------- */
  function hash(x, y, s) {
    let h = (x * 374761393 + y * 668265263 + s * 1274126177) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  function vnoise(x, y, s) {
    const xi = Math.floor(x), yi = Math.floor(y);
    let fx = x - xi, fy = y - yi;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  function fbm(x, y, oct, s) {
    let v = 0, amp = 0.5, tot = 0;
    for (let i = 0; i < oct; i++) { v += vnoise(x, y, s + i * 17) * amp; tot += amp; x *= 2.03; y *= 2.03; amp *= 0.5; }
    return v / tot;
  }
  function rng(seed) { let i = 0; return () => hash(i++, seed, 99); }
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  const PAPER = [228, 209, 170], TAN = [203, 176, 128], STAIN = [168, 130, 82], GRIME = [112, 76, 36], EDGE = [74, 47, 20];

  /* Paint one sheet. shape(x, y) returns the distance in px to the nearest worn edge
     (negative = outside); extra(x, y) returns { shade, light } tweaks for folds. */
  function paint(canvas, w, h, seed, shape, extra) {
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    const img = ctx.createImageData(w, h);
    const px = img.data;
    const rand = rng(seed);

    // Creases: long straight folds and short wrinkles, pressed into the height map
    const creases = [];
    for (let i = 0; i < 9; i++) {
      const long = i < 3;
      creases.push({
        x: rand() * w, y: rand() * h, a: rand() * Math.PI,
        len: long ? w * (0.35 + rand() * 0.5) : w * (0.05 + rand() * 0.14),
        wd: long ? 2.4 + rand() * 2.2 : 1.6 + rand() * 1.6,
        depth: (rand() < 0.5 ? -1 : 1) * (long ? 1.6 + rand() * 1.6 : 0.9 + rand() * 1.1),
      });
    }

    // Height map: broad buckling, finer crumple, creases
    const hm = new Float32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let v = fbm(x * 0.0035, y * 0.0035, 4, seed) * 46
              + Math.abs(fbm(x * 0.011, y * 0.011, 4, seed + 5) - 0.5) * 13 + fbm(x * 0.016, y * 0.016, 4, seed + 6) * 16
              + fbm(x * 0.05, y * 0.05, 3, seed + 9) * 3.2;
        for (const c of creases) {
          const dx = x - c.x, dy = y - c.y;
          const along = dx * Math.cos(c.a) + dy * Math.sin(c.a);
          if (Math.abs(along) > c.len) continue;
          const across = -dx * Math.sin(c.a) + dy * Math.cos(c.a);
          if (Math.abs(across) > c.wd * 4) continue;
          const fade = 1 - Math.pow(Math.abs(along) / c.len, 3);
          v += c.depth * Math.exp(-(across * across) / (c.wd * c.wd)) * fade;
        }
        hm[y * w + x] = v;
      }
    }

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        // Worn, torn outline: fine fraying plus the odd deeper nick
        const fray = (fbm(x * 0.028, y * 0.028, 3, seed + 21) - 0.5) * 9 + (fbm(x * 0.19, y * 0.19, 2, seed + 23) - 0.5) * 3.4;
        const nick = Math.max(0, fbm(x * 0.0075, y * 0.0075, 3, seed + 27) - 0.6) * 85;
        const sh = shape(x, y);
        const d = sh.d + (fray - nick) * sh.rough;
        if (d < -1) { px[i * 4 + 3] = 0; continue; }

        // Colour: paper → tan → tea stains, grime gathering towards the edges
        const tone = fbm(x * 0.0042 + 9, y * 0.0042 + 3, 5, seed + 31);
        let col = mix(PAPER, TAN, smooth(0.3, 0.72, tone));
        col = mix(col, STAIN, smooth(0.52, 0.8, fbm(x * 0.009 + 40, y * 0.009, 5, seed + 37)) * 0.55);
        const ring = fbm(x * 0.006 + 80, y * 0.006 + 80, 4, seed + 41); // water marks: darker along one contour
        col = mix(col, STAIN, Math.exp(-Math.pow((ring - 0.56) / 0.012, 2)) * 0.3);
        const de = sh.grime === undefined ? sh.d : sh.grime;
        const grime = Math.exp(-Math.max(0, de) / 46) * (0.35 + fbm(x * 0.018 + 7, y * 0.018, 4, seed + 43) * 1.1);
        col = mix(col, GRIME, clamp(grime * 0.8));
        col = mix(col, EDGE, smooth(7, 0, d) * 0.6);

        // Light from the top left across the crumpled surface
        const dhx = hm[i + (x < w - 1 ? 1 : 0)] - hm[i - (x > 0 ? 1 : 0)];
        const dhy = hm[i + (y < h - 1 ? w : 0)] - hm[i - (y > 0 ? w : 0)];
        let light = 1 + clamp((dhx + dhy) * 0.2, -0.34, 0.26);
        // Paper fibres and grain
        light *= 1 + (hash(x, y, seed + 51) - 0.5) * 0.07 + (fbm(x * 0.012, y * 0.45, 2, seed + 53) - 0.5) * 0.07;

        const ex = extra ? extra(x, y) : null;
        if (ex) { light *= ex.light; col = mix(col, EDGE, ex.shade); }

        px[i * 4] = clamp(col[0] * light, 0, 255);
        px[i * 4 + 1] = clamp(col[1] * light, 0, 255);
        px[i * 4 + 2] = clamp(col[2] * light, 0, 255);
        px[i * 4 + 3] = clamp(d + 1) * 255;
      }
    }
    ctx.putImageData(img, 0, 0);

    // Foxing: rust-brown age spots, a few with a paler halo
    ctx.globalCompositeOperation = "source-atop";
    for (let n = 0; n < 190; n++) {
      const x = rand() * w, y = rand() * h, r = 0.8 + Math.pow(rand(), 3) * 9, a = 0.12 + rand() * 0.34;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(104, 66, 28, ${a})`);
      g.addColorStop(0.6, `rgba(120, 80, 36, ${a * 0.55})`);
      g.addColorStop(1, "rgba(120, 80, 36, 0)");
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  // Distance to the edge of a rectangle with softly worn corners
  function rectDist(x, y, w, h, r) {
    const qx = Math.abs(x - w / 2) - (w / 2 - r), qy = Math.abs(y - h / 2) - (h / 2 - r);
    return r - (Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0));
  }
  // Signed distance from a line a→b (positive below a line drawn left to right)
  function lineDist(x, y, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    return ((y - ay) * dx - (x - ax) * dy) / Math.hypot(dx, dy);
  }

  /* ---------- Front: side flaps tucked under the bottom flap ---------- */
  const M = 9; // margin kept clear for the torn outline
  paint(document.getElementById("front"), W, H, 3,
    (x, y) => {
      const outer = rectDist(x, y, W, H, 14) - M;
      // the V opening, cut cleanly
      const v = x < W / 2 ? lineDist(x, y, 0, 0, W / 2, H * V) : lineDist(x, y, W / 2, H * V, W, 0);
      return v < outer ? { d: v, rough: 0.12, grime: Math.min(outer, v * 2.2 + 26) } : { d: outer, rough: 1, grime: Math.min(outer, v * 2.2 + 26) };
    },
    (x, y) => {
      // seams: the bottom flap lies on top and throws a soft shadow on the side flaps
      const s = x < W / 2 ? lineDist(x, y, 0, H, W / 2, H * V) : lineDist(x, y, W / 2, H * V, W, H);
      if (s >= 0) return { light: 1.035 + Math.exp(-s / 1.6) * 0.16, shade: Math.exp(-s / 30) * 0.1 }; // bottom flap, lit edge
      return { light: 0.965 - Math.exp(s / 3) * 0.2, shade: Math.exp(s / 11) * 0.42 };
    });

  /* ---------- Flap: gently bowed edges meeting in a rounded point ---------- */
  const half = (y) => (W / 2 - M) * Math.pow(clamp(1 - y / (FH - 6)), 0.9) + 10 * smooth(FH - 70, FH - 6, y) * clamp((FH - 6 - y) / 20);
  const slope = FH / Math.hypot(FH, W / 2);
  paint(document.getElementById("flap"), W, FH, 8,
    (x, y) => {
      const side = (half(y) - Math.abs(x - W / 2)) * slope;
      const top = y - 3;
      return top < side ? { d: top, rough: 0.35, grime: side } : { d: side, rough: 0.8, grime: side };
    },
    (x, y) => {
      const side = (half(y) - Math.abs(x - W / 2)) * slope;
      return { light: 1.02 + Math.exp(-Math.max(0, side) / 2) * 0.12 - Math.exp(-y / 5) * 0.1, shade: Math.exp(-y / 9) * 0.22 };
    });

  document.getElementById("out").textContent =
    "FRONT:" + document.getElementById("front").toDataURL("image/webp", 0.86) + "\n" +
    "FLAP:" + document.getElementById("flap").toDataURL("image/webp", 0.86) + "\n";
})();
</script>
</body>
</html>
